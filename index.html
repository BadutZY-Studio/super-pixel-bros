<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Super Pixel Bros - Game Platformer Pixel Klasik</title>
    <meta name="description" content="Game Platformer Pixel Klasik." />
    <meta name="theme-color" content="#181020" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Super Pixel Bros — Game Platformer Pixel Klasik" />
    <meta property="og:description" content="20 level, 9 dunia, power-up, warp pipe, dan 55 kosmetik." />
    <meta property="og:image" content="/game/ui/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/game/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/game/icon.png" />
    <link rel="preload" href="/game/fonts/PressStart2P.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* Splash awal: tampil seketika sebelum JS siap, jadi tidak ada kedipan putih. */
      html,body{margin:0;background:#181020}
      #boot{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:28px;background:#181020}
      #boot img{width:min(320px,72vw);image-rendering:pixelated;animation:b-bob 1.2s ease-in-out infinite}
      #boot-track{width:min(260px,64vw);height:14px;border:3px solid #ffd23a;padding:2px;background:#181020}
      #boot-bar{height:100%;background:#ffd23a;transform:scaleX(.06);transform-origin:left;transition:transform .25s ease}
      @keyframes b-bob{50%{transform:translateY(-8px)}}
      @media (prefers-reduced-motion:reduce){#boot img{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/game/ui/logo.png" alt="" />
      <div id="boot-track"><div id="boot-bar"></div></div>
    </div>
    <div id="root"></div>
    <noscript><p style="color:#fff;font-family:sans-serif;padding:24px">Website ini membutuhkan JavaScript.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
